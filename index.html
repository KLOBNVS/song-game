<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Whose Song Is It?</title>
<script>
/* =====================================================================
   PART 1 – PUBLIC FILE (GitHub Pages)
   Contains ONLY YouTube links and start times. No names, photos,
   titles or artists – those live in Answers_LOCAL_ONLY.html.
   - link:  YouTube link to the official music video
   - start: where the 1:30 guessing clip starts, "m:ss"
   ===================================================================== */
const SONGS = [
  { link: "https://www.youtube.com/watch?v=J36z7AnhvOM", start: "0:00" },
  { link: "https://www.youtube.com/watch?v=GR3Liudev18", start: "0:10" },
  { link: "https://www.youtube.com/watch?v=aplWTXEcY70", start: "0:02" },
];

const SETTINGS = {
  gameTitle: "Whose Song Is It?",
  subtitle: "Departmental Seminar 2026",
  guessClipSeconds: 90,
  points: "👥 <b>Colleague score:</b> 1 pt per correct colleague<br>🎧 <b>Music score:</b> 1 pt per correct artist + 1 pt per correct title<br><small>Keep the two scores separate – there's a prize for each!</small>",
};
</script>
<style>
  :root{--bg1:#1a0b2e;--bg2:#3b0f4f;--gold:#ffcc33;--pink:#ff3d7f;--cyan:#33e1ff;--white:#fff8ec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Arial,sans-serif;color:var(--white);height:100vh;overflow:hidden;
    background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1) 70%)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,.04) 0 6deg,transparent 6deg 12deg)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:3vh 4vw;text-align:center}
  .screen.active{display:flex;animation:fade .5s}
  @keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  h1{font-size:7vw;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,204,51,.6),4px 4px 0 var(--pink)}
  .sub{font-size:2vw;opacity:.85;margin-top:1vh}
  .badge{display:inline-block;padding:.5vh 2vw;border:3px solid var(--gold);border-radius:999px;
    font-weight:800;font-size:1.6vw;color:var(--gold);margin-bottom:2vh;text-transform:uppercase;letter-spacing:.2em}
  .btn{margin-top:3vh;padding:1.6vh 3vw;font-size:1.8vw;font-weight:800;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold),#f59e0b);color:#2b1300;box-shadow:0 6px 0 #a35d00;text-transform:uppercase}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35d00}
  .stage{display:flex;gap:3vw;align-items:center}
  .frame{position:relative;width:58vw;aspect-ratio:16/9;border:6px solid var(--gold);border-radius:18px;overflow:hidden;
    box-shadow:0 0 40px rgba(255,204,51,.45);background:#000}
  .frame iframe,.frame #player1{width:100%;height:100%}
  /* Transparent shield: blocks mouse hover, which would make YouTube re-show the title */
  .frame .shield{position:absolute;inset:0;z-index:2}
  /* Banner covering YouTube's title bar at the top of the video */
  .frame .titlecover{position:absolute;top:0;left:0;right:0;height:15%;z-index:3;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#1a0b2e 0%,#1a0b2e 82%,rgba(26,11,46,0) 100%);
    color:var(--gold);font-weight:900;font-size:1.6vw;letter-spacing:.25em;text-transform:uppercase}
  .num{font-size:12vw;font-weight:900;color:var(--gold);line-height:1;text-shadow:4px 4px 0 var(--pink)}
  .timer{font-size:5vw;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cyan);margin-top:1vh}
  .bar{width:100%;height:12px;background:rgba(255,255,255,.15);border-radius:6px;margin-top:1vh;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .25s linear}
  .side{width:22vw}
  .scoring{font-size:1.8vw;margin-top:3vh;padding:2vh 3vw;border:2px dashed var(--cyan);border-radius:14px;line-height:1.5}
  .nav{position:fixed;bottom:1.5vh;right:2vw;font-size:1vw;opacity:.45}
</style>
</head>
<body>

<section class="screen active" id="s-title">
  <div class="badge">🎵 Icebreaker 🎵</div>
  <h1 id="gameTitle"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="scoring">Write down <b>whose favourite song</b> each one is.<br><span id="pointsTxt"></span></div>
  <button class="btn" onclick="startPart1()">Let's play ▶</button>
</section>

<section class="screen" id="s-part1">
  <div class="badge">Part 1 · Guess whose song</div>
  <div class="stage">
    <div class="side">
      <div style="font-size:2vw;letter-spacing:.2em">SONG</div>
      <div class="num" id="p1num">1</div>
      <div style="font-size:1.6vw;opacity:.8" id="p1of"></div>
      <div class="timer" id="p1timer">1:30</div>
      <div class="bar"><i id="p1bar"></i></div>
      <button class="btn" onclick="nextPart1()" id="p1next">Next song ▶</button>
    </div>
    <div class="frame">
      <div id="player1"></div>
      <div class="shield"></div>
      <div class="titlecover">🎵 Whose song is it? 🎵</div>
    </div>
  </div>
</section>

<section class="screen" id="s-swap">
  <div class="badge">Time's up!</div>
  <h1>🔄 Swap sheets!</h1>
  <div class="sub">Pass your answer sheet to the person on your left.<br>Time to mark.</div>
  <div class="sub" style="margin-top:3vh">Answers coming up next… 🥁</div>
</section>

<div class="nav">→ / Space = next · P = pause/play</div>

<script>
document.getElementById("gameTitle").textContent = SETTINGS.gameTitle;
document.getElementById("subtitle").textContent = SETTINGS.subtitle;
document.getElementById("pointsTxt").innerHTML = SETTINGS.points;

const toSec = t => { if(!t) return 0; const p=String(t).split(":").map(Number); return p.length===2?p[0]*60+p[1]:p[0]; };
const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,Math.floor(s%60))).padStart(2,"0")}`;
const vid = url => { const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:url; };
const show = id => { document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.getElementById(id).classList.add("active"); };

let p1, ready=false, pending=null, i=0, phase="title", tick;

// YouTube player – clips are queued until the player is ready (prevents crashes)
const tag=document.createElement("script"); tag.src="https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=function(){
  const vars={controls:0,rel:0,modestbranding:1,playsinline:1,disablekb:1,iv_load_policy:3};
  if(location.protocol.startsWith("http")) vars.origin=location.origin;
  p1=new YT.Player("player1",{playerVars:vars,events:{
    onReady:()=>{ ready=true; if(pending){ pending(); pending=null; } }
  }});
};

function playClip(song){
  const s=toSec(song.start), e=s+SETTINGS.guessClipSeconds, len=SETTINGS.guessClipSeconds;
  clearInterval(tick);
  const go=()=>{
    p1.loadVideoById({videoId:vid(song.link), startSeconds:s, endSeconds:e});
    tick=setInterval(()=>{
      let t=0; try{ t=p1.getCurrentTime(); }catch(_){}
      const left=Math.min(len,Math.max(0,e-t));
      if(t>=s-1){ document.getElementById("p1timer").textContent=fmt(Math.ceil(left));
        document.getElementById("p1bar").style.width=(left/len*100)+"%"; }
      if(t>=e-0.2){ p1.pauseVideo(); clearInterval(tick); document.getElementById("p1timer").textContent="0:00"; }
    },250);
  };
  if(ready) go(); else pending=go;
}

function startPart1(){ phase="p1"; i=0; show("s-part1"); playP1(); }
function playP1(){
  document.getElementById("p1num").textContent=i+1;
  document.getElementById("p1of").textContent=`of ${SONGS.length}`;
  document.getElementById("p1timer").textContent=fmt(SETTINGS.guessClipSeconds);
  document.getElementById("p1bar").style.width="100%";
  document.getElementById("p1next").textContent = i===SONGS.length-1 ? "Finish round ▶" : "Next song ▶";
  playClip(SONGS[i]);
}
function nextPart1(){
  if(i<SONGS.length-1){ i++; playP1(); }
  else { clearInterval(tick); pending=null; if(ready) p1.stopVideo(); phase="swap"; show("s-swap"); }
}

document.addEventListener("keydown",e=>{
  if(["ArrowRight"," ","PageDown","Enter"].includes(e.key)){ e.preventDefault();
    if(phase==="title") startPart1(); else if(phase==="p1") nextPart1(); }
  if(e.key.toLowerCase()==="p" && ready && phase==="p1")
    p1.getPlayerState()===1 ? p1.pauseVideo() : p1.playVideo();
});
</script>
</body>
</html>
